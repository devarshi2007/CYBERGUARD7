<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Check API Key</title>
</head>
<body>
    <h1>Checking API Key</h1>
    <button id="check-btn">Check API Key</button>
    <div id="result"></div>

    <script>
        const API_KEY = 'AIzaSyCHN6UVBTh6hgleliNb3-7k1YlJzHJlYEU';
        
        document.getElementById('check-btn').addEventListener('click', async () => {
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = 'Checking API key...';
            
            try {
                // Test 1: List models using REST API
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models?key=${API_KEY}`);
                
                if (!response.ok) {
                    const errorText = await response.text();
                    resultDiv.innerHTML = `<p style="color: red;">âŒ API Key Error (${response.status}): ${errorText}</p>`;
                    console.error('API Error:', errorText);
                    return;
                }
                
                const data = await response.json();
                
                if (data.models && data.models.length > 0) {
                    resultDiv.innerHTML = '<h2 style="color: green;">âœ… API Key is Valid!</h2>';
                    resultDiv.innerHTML += '<h3>Available Models:</h3>';
                    
                    data.models.forEach(model => {
                        const modelName = model.name.replace('models/', '');
                        const methods = model.supportedGenerationMethods ? model.supportedGenerationMethods.join(', ') : 'N/A';
                        resultDiv.innerHTML += `
                            <div style="margin: 10px 0; padding: 10px; border: 1px solid #ccc; border-radius: 5px;">
                                <strong>${modelName}</strong><br>
                                <small>Full name: ${model.name}</small><br>
                                <small>Methods: ${methods}</small>
                            </div>
                        `;
                    });
                } else {
                    resultDiv.innerHTML = '<p style="color: orange;">âš ï¸ API key valid but no models available</p>';
                }
                
            } catch (error) {
                resultDiv.innerHTML = `<p style="color: red;">âŒ Error: ${error.message}</p>`;
                console.error(error);
            }
        });
    </script>
</body>
</html>
