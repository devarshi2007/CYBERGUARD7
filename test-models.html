<!DOCTYPE html>
<html>
<head>
    <title>Test Gemini Models</title>
</head>
<body>
    <h1>Testing Available Models</h1>
    <div id="output"></div>
    
    <script type="module">
        import { GoogleGenerativeAI } from "https://esm.run/@google/generative-ai";
        
        const API_KEY = 'AIzaSyB_v9RY1yMcPBPGq2jjKSG5ABV3kVsIwL8';
        const genAI = new GoogleGenerativeAI(API_KEY);
        const output = document.getElementById('output');
        
        const models = [
            "gemini-pro",
            "gemini-1.5-pro",
            "gemini-1.5-flash",
            "gemini-1.5-flash-latest",
            "gemini-2.0-flash-exp",
            "gemini-exp-1206"
        ];
        
        for (const modelName of models) {
            try {
                output.innerHTML += `<p>Testing ${modelName}...</p>`;
                const model = genAI.getGenerativeModel({ model: modelName });
                const result = await model.generateContent("Say hello");
                const response = await result.response;
                const text = response.text();
                output.innerHTML += `<p style="color: green;">✓ ${modelName} works! Response: ${text}</p>`;
                break; // Stop at first working model
            } catch (error) {
                output.innerHTML += `<p style="color: red;">✗ ${modelName} failed: ${error.message}</p>`;
            }
        }
    </script>
</body>
</html>
