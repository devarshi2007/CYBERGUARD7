<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Test Gemini API</title>
    <script type="importmap">
    {
      "imports": {
        "@google/generative-ai": "https://esm.run/@google/generative-ai"
      }
    }
    </script>
</head>
<body>
    <h1>Testing Gemini API</h1>
    <button id="test-btn">Test API</button>
    <div id="result"></div>

    <script type="module">
        import { GoogleGenerativeAI } from "@google/generative-ai";

        const API_KEY = 'AIzaSyCHN6UVBTh6hgleliNb3-7k1YlJzHJlYEU';
        
        document.getElementById('test-btn').addEventListener('click', async () => {
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = 'Testing...';
            
            try {
                const genAI = new GoogleGenerativeAI(API_KEY);
                
                // Try different model names
                const modelsToTest = [
                    'gemini-1.5-pro',
                    'gemini-1.5-flash',
                    'gemini-pro',
                    'models/gemini-1.5-pro',
                    'models/gemini-1.5-flash'
                ];
                
                for (const modelName of modelsToTest) {
                    try {
                        console.log(`Testing model: ${modelName}`);
                        const model = genAI.getGenerativeModel({ model: modelName });
                        const result = await model.generateContent("Say 'hi'");
                        const response = await result.response;
                        const text = response.text();
                        
                        resultDiv.innerHTML += `<p style="color: green;">✅ <strong>${modelName}</strong> works! Response: ${text}</p>`;
                        console.log(`✅ ${modelName} works:`, text);
                        break;
                    } catch (error) {
                        resultDiv.innerHTML += `<p style="color: red;">❌ <strong>${modelName}</strong> failed: ${error.message}</p>`;
                        console.error(`❌ ${modelName} failed:`, error);
                    }
                }
            } catch (error) {
                resultDiv.innerHTML = `<p style="color: red;">Error: ${error.message}</p>`;
                console.error(error);
            }
        });
    </script>
</body>
</html>
